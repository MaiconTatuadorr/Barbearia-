name = "barbearia-agendamento"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Depois de criar seu banco com `wrangler d1 create barbearia-db`,
# cole o database_id gerado aqui embaixo.
[[d1_databases]]
binding = "DB"
database_name = "barbearia-db"
database_id = "COLOQUE_AQUI_O_ID_DO_SEU_BANCO_D1"
